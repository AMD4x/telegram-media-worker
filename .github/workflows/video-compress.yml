name: Video Compress To Telegram
run-name: "AMD4x Video Compress · ${{ inputs.compression_level }} · ${{ inputs.send_as }}"

on:
  workflow_dispatch:
    inputs:
      media_url:
        description: "Media URL"
        required: true
        type: string
      compression_level:
        description: "Compression level: 1 best quality / light compression, 100 strongest compression / smallest size"
        required: true
        default: "50"
        type: string
      send_as:
        description: "Send compressed output as"
        required: true
        default: "video"
        type: choice
        options:
          - "video"
          - "document"
          - "zip"
      output_filename:
        description: "Optional output filename. .mp4 or .zip is normalized automatically."
        required: false
        type: string
      chat_id:
        description: "Optional Telegram destination chat id. Falls back to TELEGRAM_CHAT_ID then ADMIN_ID."
        required: false
        type: string
      progress_chat_id:
        description: "Telegram progress chat id. Falls back to chat_id/TELEGRAM_CHAT_ID/ADMIN_ID."
        required: false
        type: string
      progress_message_id:
        description: "Telegram progress message id to edit. If empty, the workflow creates one when possible."
        required: false
        type: string
      reply_to_message_id:
        description: "Optional Telegram message id to reply to when sending the final output."
        required: false
        type: string
      dispatch_key:
        description: "Dispatch key"
        required: false
        default: "manual"
        type: string

permissions:
  contents: read
  packages: read

jobs:
  video_compress_send:
    name: Compress video and send to Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 360

    container:
      image: ghcr.io/amd4x/tg-video-worker:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    outputs:
      final_file_name: ${{ steps.video_compress.outputs.final_file_name }}
      final_size_bytes: ${{ steps.video_compress.outputs.final_size_bytes }}
      send_as: ${{ steps.video_compress.outputs.send_as }}
      send_method: ${{ steps.video_compress.outputs.send_method }}
      telegram_message_id: ${{ steps.video_compress.outputs.telegram_message_id }}
      compression_level: ${{ steps.video_compress.outputs.compression_level }}
      crf: ${{ steps.video_compress.outputs.crf }}
      preset: ${{ steps.video_compress.outputs.preset }}
      audio_bitrate: ${{ steps.video_compress.outputs.audio_bitrate }}
      max_height: ${{ steps.video_compress.outputs.max_height }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Load video compress script
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p scripts/video_compress

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/scripts/video_compress/video_compress_worker.py?ref=${GITHUB_SHA}" \
            -o scripts/video_compress/video_compress_worker.py

          python3 -m py_compile scripts/video_compress/video_compress_worker.py

      - name: Compress and send to Telegram
        id: video_compress
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          YOUTUBE_COOKIES_TXT: ${{ secrets.YOUTUBE_COOKIES_TXT }}
          FACEBOOK_COOKIES_TXT: ${{ secrets.FACEBOOK_COOKIES_TXT }}
        run: |
          set -euo pipefail

          # Load sensitive workflow inputs after the job starts so they do not appear in the Actions env block.
          get_workflow_input() {
            local input_name="$1"
            local fallback_env="${2:-}"

            if [ -n "${GITHUB_ACTIONS:-}" ] && [ -n "${GITHUB_EVENT_PATH:-}" ]; then
              python3 -c 'import json, os, sys; data=json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8")); print(((data.get("inputs") or {}).get(sys.argv[1], "") or ""), end="")' "$input_name"
            elif [ -n "$fallback_env" ]; then
              printf "%s" "${!fallback_env:-}"
            fi
          }

          mask_if_set() {
            [ -z "${1:-}" ] && return 0
            local value="$1"
            value="${value//'%'/'%25'}"
            value="${value//$'\r'/'%0D'}"
            value="${value//$'\n'/'%0A'}"
            echo "::add-mask::$value"
          }

          MEDIA_URL_INPUT="$(get_workflow_input media_url MEDIA_URL_INPUT)"
          COMPRESSION_LEVEL_INPUT="$(get_workflow_input compression_level COMPRESSION_LEVEL_INPUT)"
          SEND_AS_INPUT="$(get_workflow_input send_as SEND_AS_INPUT)"
          OUTPUT_FILENAME_INPUT="$(get_workflow_input output_filename OUTPUT_FILENAME_INPUT)"
          CHAT_ID_INPUT="$(get_workflow_input chat_id CHAT_ID_INPUT)"
          PROGRESS_CHAT_ID="$(get_workflow_input progress_chat_id PROGRESS_CHAT_ID)"
          PROGRESS_MESSAGE_ID="$(get_workflow_input progress_message_id PROGRESS_MESSAGE_ID)"
          REPLY_TO_MESSAGE_ID="$(get_workflow_input reply_to_message_id REPLY_TO_MESSAGE_ID)"
          DISPATCH_KEY="$(get_workflow_input dispatch_key DISPATCH_KEY)"

          COMPRESSION_LEVEL_INPUT="${COMPRESSION_LEVEL_INPUT:-50}"
          SEND_AS_INPUT="${SEND_AS_INPUT:-video}"

          mask_if_set "$MEDIA_URL_INPUT"
          mask_if_set "$OUTPUT_FILENAME_INPUT"
          mask_if_set "$CHAT_ID_INPUT"
          mask_if_set "$PROGRESS_CHAT_ID"
          mask_if_set "$PROGRESS_MESSAGE_ID"
          mask_if_set "$REPLY_TO_MESSAGE_ID"
          mask_if_set "$DISPATCH_KEY"

          export MEDIA_URL_INPUT COMPRESSION_LEVEL_INPUT SEND_AS_INPUT OUTPUT_FILENAME_INPUT
          export CHAT_ID_INPUT PROGRESS_CHAT_ID PROGRESS_MESSAGE_ID REPLY_TO_MESSAGE_ID DISPATCH_KEY

          python3 scripts/video_compress/video_compress_worker.py
