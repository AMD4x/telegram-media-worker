name: Package Repacker
run-name: "AMD4x Package Repack"

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Original source URL used by package-inspect.yml"
        required: true
        type: string
      keep_indexes:
        description: "Indexes to keep, e.g. 1,2,4-6. Empty means keep everything except delete_indexes."
        required: false
        type: string
      delete_indexes:
        description: "Indexes to delete, e.g. 3,5. Ignored when keep_indexes is provided."
        required: false
        type: string
      rename_map_json:
        description: "JSON object mapping original manifest path/name/index to new relative path"
        required: false
        type: string
      output_filename:
        description: "Output ZIP filename"
        required: false
        default: "package_output.zip"
        type: string
      split_part_mib:
        description: "Part size in MiB for ZIP files larger than Telegram single-file limit"
        required: false
        default: "1900"
        type: string
      progress_chat_id:
        description: "Telegram progress chat id"
        required: false
        type: string
      progress_message_id:
        description: "Telegram progress message id"
        required: false
        type: string
      dispatch_key:
        description: "Dispatch key for bot-side correlation"
        required: false
        default: "manual"
        type: string
      send_telegram:
        description: "Send output ZIP to Telegram"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  package_repack:
    name: Repack selected package items
    runs-on: ubuntu-latest
    timeout-minutes: 360

    container:
      image: ghcr.io/amd4x/tg-video-worker:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare package tools
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends aria2 p7zip-full libarchive-tools unrar-free unzip ca-certificates
          fi
          python3 --version
          aria2c --version | head -n 1 || true
          7z | head -n 2 || true

      - name: Repack and send result
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -euo pipefail
          mkdir -p work/package-repack

          # Load sensitive workflow inputs after the job starts so they do not appear in the Actions env block.
          get_workflow_input() {
            local input_name="$1"
            local fallback_env="${2:-}"

            if [ -n "${GITHUB_ACTIONS:-}" ] && [ -n "${GITHUB_EVENT_PATH:-}" ]; then
              python3 -c 'import json, os, sys; data=json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8")); print(((data.get("inputs") or {}).get(sys.argv[1], "") or ""), end="")' "$input_name"
            elif [ -n "$fallback_env" ]; then
              printf "%s" "${!fallback_env:-}"
            fi
          }

          mask_if_set() {
            [ -z "${1:-}" ] && return 0
            local value="$1"
            value="${value//'%'/'%25'}"
            value="${value//$'\r'/'%0D'}"
            value="${value//$'\n'/'%0A'}"
            echo "::add-mask::$value"
          }

          SOURCE_URL="$(get_workflow_input source_url SOURCE_URL)"
          KEEP_INDEXES="$(get_workflow_input keep_indexes KEEP_INDEXES)"
          DELETE_INDEXES="$(get_workflow_input delete_indexes DELETE_INDEXES)"
          RENAME_MAP_JSON="$(get_workflow_input rename_map_json RENAME_MAP_JSON)"
          OUTPUT_FILENAME="$(get_workflow_input output_filename OUTPUT_FILENAME)"
          SPLIT_PART_MIB="$(get_workflow_input split_part_mib SPLIT_PART_MIB)"
          PROGRESS_CHAT_ID="$(get_workflow_input progress_chat_id PROGRESS_CHAT_ID)"
          PROGRESS_MESSAGE_ID="$(get_workflow_input progress_message_id PROGRESS_MESSAGE_ID)"
          DISPATCH_KEY="$(get_workflow_input dispatch_key DISPATCH_KEY)"
          SEND_TELEGRAM="$(get_workflow_input send_telegram SEND_TELEGRAM)"

          mask_if_set "$SOURCE_URL"
          mask_if_set "$RENAME_MAP_JSON"
          mask_if_set "$OUTPUT_FILENAME"
          mask_if_set "$PROGRESS_CHAT_ID"
          mask_if_set "$PROGRESS_MESSAGE_ID"
          mask_if_set "$DISPATCH_KEY"
          [ -n "${TELEGRAM_TOKEN:-}" ] && echo "::add-mask::${TELEGRAM_TOKEN}"
          [ -n "${TELEGRAM_CHAT_ID:-}" ] && echo "::add-mask::${TELEGRAM_CHAT_ID}"
          [ -n "${ADMIN_ID:-}" ] && echo "::add-mask::${ADMIN_ID}"

          python3 scripts/package_tools/repack.py \
            --source-url "$SOURCE_URL" \
            --keep-indexes "${KEEP_INDEXES:-}" \
            --delete-indexes "${DELETE_INDEXES:-}" \
            --rename-map-json "${RENAME_MAP_JSON:-}" \
            --output-filename "${OUTPUT_FILENAME:-package_output.zip}" \
            --split-part-mib "${SPLIT_PART_MIB:-1900}" \
            --dispatch-key "${DISPATCH_KEY:-manual}" \
            --progress-chat-id "${PROGRESS_CHAT_ID:-}" \
            --progress-message-id "${PROGRESS_MESSAGE_ID:-}" \
            --work-dir "work/package-repack" \
            --send-telegram "${SEND_TELEGRAM:-true}"

